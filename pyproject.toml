[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capra"
version = "2.0.0"
description = "CAPRA 2.0 - Context-Aware Mobile App Privacy Risk Analyzer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "VIT Pune CS-AI Group 8", email = "edai-group8@vit.edu"},
    {name = "Suraj", email = "suraj@vit.edu"},
    {name = "Omraj", email = "omraj@vit.edu"},
    {name = "Ishan", email = "ishan@vit.edu"},
    {name = "Samriddhi", email = "samriddhi@vit.edu"}
]
keywords = [
    "android", "cybersecurity", "static-analysis", "privacy", "risk-assessment",
    "androguard", "machine-learning", "virustotal", "threat-intelligence"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "androguard>=4.1.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
    "colorama>=0.4.6",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "coverage>=7.4.0"
]

[project.scripts]
capra = "main:main"
capra-gui = "src.gui:launch_gui"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*"]

