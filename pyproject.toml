[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "capra"
version = "2.0.0"
description = "CAPRA 2.0 - Context-Aware Mobile App Privacy Risk Analyzer"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "VIT Pune CS-AI Group 8", email = "edai-group8@vit.edu"},
    {name = "Suraj", email = "suraj@vit.edu"},
    {name = "Omraj", email = "omraj@vit.edu"},
    {name = "Ishan", email = "ishan@vit.edu"},
    {name = "Samriddhi", email = "samriddhi@vit.edu"}
]
keywords = [
    "android", "cybersecurity", "static-analysis", "privacy", "risk-assessment",
    "androguard", "machine-learning", "virustotal", "threat-intelligence"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Security",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12"
]
dependencies = [
    "androguard>=4.1.0",
    "scikit-learn>=1.4.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "matplotlib>=3.8.0",
    "joblib>=1.3.0",
    "colorama>=0.4.6",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0"
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
]
dev = [
    "pytest>=8.0.0",
    "coverage>=7.4.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "pre-commit>=3.6.0",
    "httpx>=0.27.0",
]

[project.scripts]
capra = "main:main"
capra-gui = "src.gui:launch_gui"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "data*"]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [".venv", "build", "dist", "capra.egg-info"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "I"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # function calls in defaults (argparse patterns)
    "UP007",  # keep Optional[X] typing style used across the codebase
    "UP006",  # keep Dict/List typing style used across the codebase
    "UP035",  # keep typing.List/Set imports (consistent with UP006)
    "UP045",  # keep Optional[X] annotations (consistent with UP007)
]

[tool.ruff.lint.per-file-ignores]
# sys.path bootstrap must run before first-party imports in standalone scripts
"scripts/*" = ["E402"]
"src/gui.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.coverage.run]
source = ["src"]
omit = ["src/gui.py"]

[tool.coverage.report]
show_missing = true
skip_empty = true

